<!DOCTYPE html>
<html lang="es">

<head>

    <!-- Configuración del documento -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título -->
    <title>ATLAS | Catálogo Oficial</title>

    <!-- Icono (Lo agregaremos después) -->
    <link rel="icon" href="img/logo/favicon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

    <!-- ========================================= -->
    <!-- HEADER                                   -->
    <!-- Logo | Buscador | WhatsApp | Carrito     -->
    <!-- ========================================= -->

    <header id="header">
        <div class="container header-container">

        <!-- Logo -->
        <div class="logo">

            <h1>ATLAS</h1>

        </div>

        <!-- Menú -->
        <nav class="menu">

            <a href="#hero">Inicio</a>

            <a href="#catalogo">Catálogo</a>

            <a href="#destacados">Destacados</a>

        </nav>

        <!-- Acciones -->

        <div class="acciones">

            <button class="btn-icono">

                <i class="fa-solid fa-magnifying-glass"></i>

            </button>

            <button class="btn-icono">

                <i class="fa-brands fa-whatsapp"></i>

            </button>

            <button class="btn-icono carrito">

                <i class="fa-solid fa-cart-shopping"></i>

                <span class="contador">0</span>

            </button>

        </div>

    </div>

</header>




    <!-- ========================================= -->
    <!-- HERO                                     -->
    <!-- Banner Principal                         -->
    <!-- ========================================= -->

    <section id="hero">

    </section>



    <!-- ========================================= -->
    <!-- PRODUCTOS DESTACADOS                     -->
    <!-- ========================================= -->

    <section id="destacados">

    </section>



    <!-- ========================================= -->
    <!-- FILTROS                                  -->
    <!-- ========================================= -->

    <section id="filtros">

    </section>



    <!-- ========================================= -->
    <!-- CATÁLOGO                                 -->
    <!-- Aquí JavaScript generará los productos   -->
    <!-- ========================================= -->

    <main id="catalogo">

    </main>



    <!-- ========================================= -->
    <!-- CARRITO                                  -->
    <!-- ========================================= -->

    <aside id="carrito">

    </aside>



    <!-- ========================================= -->
    <!-- FOOTER                                   -->
    <!-- ========================================= -->

    <footer>

    </footer>


    <!-- JavaScript -->

    <script src="js/config.js"></script>
    <script src="js/productos.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/whatsapp.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
